<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1010" viewBox="0 0 1120 1010" role="img" aria-labelledby="title description">
<title id="title">I fixed one customer issue</title>
<desc id="description">Fictional Agency card. Noah complained that the download button is not working. Before: nothing happens. After the fix: the file downloads. Expanders show the complaint, PR and message. The action is Merge PR and message customer. Chat, Skip, Auto-improve and send controls sit below.</desc>
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#322c21" flood-opacity=".07"/></filter>
<g id="download" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v17m-6-6 6 6 6-6M2 22v5h20v-5"/></g>
<g id="chevron" fill="none" stroke="#79756d" stroke-width="2.5" stroke-linecap="round"><path d="m0 0 6 6-6 6"/></g>
</defs>
<rect width="1120" height="1010" fill="#f1efe9"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<text x="68" y="55" font-size="22" fill="#26291f" font-weight="750" letter-spacing="-.6">agency<tspan fill="#7160c3">✳</tspan></text>
<text x="1052" y="54" text-anchor="end" font-size="15" fill="#746f66">AI finds the work. You decide.</text>
<rect x="48" y="85" width="1024" height="778" rx="28" fill="#fffefa" stroke="#e3ded5" filter="url(#shadow)"/>
<rect x="82" y="119" width="206" height="30" rx="15" fill="#f0ecfc"/>
<text x="185" y="139" text-anchor="middle" font-size="13" font-weight="650" fill="#61509f">SUPPORT → DOWNLOADS</text>
<text x="82" y="220" font-size="60" font-weight="750" letter-spacing="-2.4" fill="#282820">I fixed one customer issue.</text>
<text x="84" y="265" font-size="23" fill="#423e37">Noah complained that the download button is not working.</text>
<g transform="translate(84 304)">
<rect width="458" height="258" rx="20" fill="#fcf1ed" stroke="#f0ded6"/>
<text x="24" y="35" font-size="13" font-weight="750" letter-spacing="1.4" fill="#a7543e">BEFORE</text>
<rect x="117" y="65" width="224" height="60" rx="12" fill="#fffefa" stroke="#b96650"/>
<use href="#download" x="139" y="81" color="#a7543e"/>
<text x="180" y="104" font-size="23" font-weight="600" fill="#843d2a">Download</text>
<g transform="translate(208 146)" stroke="#a7543e" stroke-width="2.8" fill="none"><circle cx="21" cy="21" r="19"/><path d="m14 14 14 14m0-14L14 28"/></g>
<text x="229" y="229" text-anchor="middle" font-size="31" font-weight="750" letter-spacing="-.8" fill="#843d2a">Nothing happens</text>
</g>
<g transform="translate(564 304)">
<rect width="474" height="258" rx="20" fill="#edf5eb" stroke="#dce8d8"/>
<text x="24" y="35" font-size="13" font-weight="750" letter-spacing="1.4" fill="#43734a">AFTER THE FIX</text>
<rect x="125" y="65" width="224" height="60" rx="12" fill="#fffefa" stroke="#5b8757"/>
<use href="#download" x="147" y="81" color="#43734a"/>
<text x="188" y="104" font-size="23" font-weight="600" fill="#315b35">Download</text>
<g transform="translate(215 144)" stroke="#43734a" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h14l9 9v29H10zM24 2v10h9m-18 13 5 5 10-11"/></g>
<text x="237" y="229" text-anchor="middle" font-size="31" font-weight="750" letter-spacing="-.8" fill="#315b35">File downloads</text>
</g>
<g fill="#3e3b35" font-size="19" font-weight="550">
<path d="M84 584h954M84 641h954M84 698h954M84 755h954" stroke="#e7e1d7"/>
<use href="#chevron" x="91" y="607"/><text x="119" y="620">Customer message</text>
<use href="#chevron" x="91" y="664"/><text x="119" y="677">See the PR</text>
<use href="#chevron" x="91" y="721"/><text x="119" y="734">Message to Noah</text>
</g>
<rect x="84" y="776" width="954" height="62" rx="15" fill="#34372c"/>
<text x="561" y="816" text-anchor="middle" font-size="25" font-weight="650" fill="#fffdf4">Merge PR and message customer</text>
<rect x="48" y="882" width="1024" height="64" rx="24" fill="#fff" stroke="#e4e1da" filter="url(#shadow)"/>
<text x="70" y="922" font-size="16" fill="#8d8a80">Add context or say what to change…</text>
<path d="m799 907 14 14m0-14-14 14" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
<text x="843" y="920" font-size="15" font-weight="600" fill="#5b4fe9">✦ Auto-improve</text>
<circle cx="1036" cy="914" r="20" fill="#16150f" opacity=".3"/>
<path d="M1036 922v-16m-6 6 6-6 6 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="68" y="977" font-size="14" font-weight="600" fill="#5a5850">← Back</text>
<text x="560" y="977" text-anchor="middle" font-size="13" font-weight="600" fill="#8d8a80">1 of 1</text>
<text x="1052" y="977" text-anchor="end" font-size="14" font-weight="600" fill="#5a5850">Next →</text>
</g>
</svg>
